name: Collect and publish Gaugecraft

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Editing cron also re-registers GitHub’s schedule trigger if delivery stalls.
    - cron: "17 * * * *"
    - cron: "47 * * * *"

# Serialize database restoration, collection, backup and deployment. Never cancel a writer.
concurrency:
  group: gaugecraft-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule' || vars.COLLECTOR_HOSTING != 'railway'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Validate hosting configuration
        if: vars.COLLECTOR_HOSTING == 'railway'
        run: node -e 'const u = new URL(process.env.VITE_API_ORIGIN); if (u.protocol !== "https:" || u.pathname !== "/") throw new Error("Set VITE_API_ORIGIN to the verified Railway HTTPS origin before cutover")'
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
      - name: Validate application
        run: |
          pnpm lint
          pnpm test
          pnpm build
        env:
          VITE_DATA_MODE: ${{ vars.COLLECTOR_HOSTING == 'railway' && 'api' || 'static' }}
          VITE_API_ORIGIN: ${{ vars.COLLECTOR_HOSTING == 'railway' && vars.VITE_API_ORIGIN || '' }}
      - name: Restore durable observation history
        if: vars.COLLECTOR_HOSTING != 'railway'
        run: node --import tsx server/pages-state.ts restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect public onchain observations
        if: vars.COLLECTOR_HOSTING != 'railway'
        id: collect
        continue-on-error: true
        run: pnpm collect
      - name: Seed the separate, labeled fixture namespace once
        if: vars.COLLECTOR_HOSTING != 'railway'
        run: pnpm demo
      - name: Preserve database before publishing
        if: vars.COLLECTOR_HOSTING != 'railway'
        run: node --import tsx server/pages-state.ts save
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Export static research data
        if: vars.COLLECTOR_HOSTING != 'railway'
        run: pnpm export:pages
      - name: Publish methodology for API-backed frontend
        if: vars.COLLECTOR_HOSTING == 'railway'
        run: node -e 'const fs = require("node:fs"); for (const f of ["SOURCES.md", "PLAN.md"]) fs.copyFileSync(f, "dist/" + f); fs.writeFileSync("dist/.nojekyll", "")'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Record collection outcome
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::Collection failed. Publishing the last successful observations with their original timestamps and current error status.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
